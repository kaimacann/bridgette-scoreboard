[build]
command = "pnpm build"
publish = "dist"

[build.environment]
NODE_VERSION = "22.19.0"
NPM_FLAGS = "--include=optional"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/*"

[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
